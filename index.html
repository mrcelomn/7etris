<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>7etris</title>
<meta name="theme-color" content="#121418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="7etris">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="field" id="field">
    <div class="lcd" id="lcd">
      <div class="side left">
        <button class="ui pause-btn" id="pauseBtn" aria-label="Pausar"><i></i><i></i></button>
        <div><div class="label">HOLD</div><div class="slot"><canvas id="hold"></canvas></div></div>
        <div class="stats">
          <div class="stat"><div class="label" id="linesLbl">LINHAS</div><div class="v" id="lines">0</div></div>
          <div class="stat"><div class="label">PEÇAS</div><div class="v" id="pieces">0</div></div>
          <div class="stat"><div class="label">TEMPO</div><div class="v time" id="time">0:00</div></div>
        </div>
      </div>
      <div class="board-wrap"><canvas id="board"></canvas></div>
      <div class="side right">
        <div><div class="label">NEXT</div><div class="slot"><canvas id="next"></canvas></div></div>
      </div>
    </div>
    <div class="brand" id="brand" aria-hidden="true">7ETRIS<small>POCKET</small></div>
  </div>
</div>

<div class="safe-probe" id="safeProbe"></div>
<div class="pad">
  <div class="ctl dpad" id="dpad" data-ctl="dpad" role="group" aria-label="Direcional">
    <div class="arm up"></div><div class="arm left"></div><div class="arm mid"></div><div class="arm right"></div><div class="arm down"></div>
  </div>
  <button class="ctl btn" id="btnB" data-ctl="b" aria-label="B: guardar peça">B<small>HOLD</small></button>
  <button class="ctl btn" id="btnA" data-ctl="a" aria-label="A: girar">A<small>GIRAR</small></button>
</div>

<div class="ui editbar" id="editbar" hidden>
  <p>Arraste para mover · pinça para mudar o tamanho</p>
  <div class="edit-row">
    <button class="key" id="padReset">PADRÃO</button>
    <button class="key primary" id="padDone">PRONTO</button>
  </div>
</div>

<div class="ui screen" id="menu" hidden>
  <div class="theme" role="group" aria-label="Tema">
    <button data-theme-set="light" aria-label="Modo claro">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
    </button>
    <button data-theme-set="dark" aria-label="Modo escuro">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    </button>
  </div>
  <div class="panel">
    <h1><span>7</span>ETRIS</h1>
    <div class="group">
      <div class="glabel">JOGAR</div>
      <button class="row" id="marathonBtn" aria-expanded="false">MARATONA<span class="chev" aria-hidden="true"></span></button>
      <div class="cascade" id="marathonList" hidden>
        <button class="row" data-mode="20">20 LINHAS<span class="rec" data-rec="20">—</span></button>
        <button class="row" data-mode="40">40 LINHAS<span class="rec" data-rec="40">—</span></button>
        <button class="row" data-mode="100">100 LINHAS<span class="rec" data-rec="100">—</span></button>
      </div>
      <button class="row" data-mode="free">LIVRE</button>
    </div>
    <div class="group">
      <div class="glabel">AJUSTES</div>
      <button class="row" id="openSkins">SKINS<span class="chev side" aria-hidden="true"></span></button>
      <button class="row" id="openSound">ÁUDIO<span class="chev side" aria-hidden="true"></span></button>
      <button class="row" id="openPad">CONTROLES<span class="chev side" aria-hidden="true"></span></button>
    </div>
    <div class="ver" id="ver"></div>
  </div>
</div>

<div class="ui screen" id="skinScr" hidden>
  <div class="panel">
    <h2>SKINS</h2>
    <div class="group" id="skinList"></div>
    <button class="row primary" id="skinBack">VOLTAR</button>
  </div>
</div>

<div class="ui screen" id="soundScr" hidden>
  <div class="panel">
    <h2>ÁUDIO</h2>
    <div class="setting">
      <div class="setting-head">MÚSICA<button class="toggle" id="musicOn" aria-label="Música ligada"></button></div>
      <input type="range" id="musicVol" min="0" max="100" aria-label="Volume da música">
    </div>
    <div class="setting">
      <div class="setting-head">EFEITOS<button class="toggle" id="sfxOn" aria-label="Efeitos ligados"></button></div>
      <input type="range" id="sfxVol" min="0" max="100" aria-label="Volume dos efeitos">
    </div>
    <button class="row primary" id="soundBack">VOLTAR</button>
  </div>
</div>

<div class="ui screen" id="pauseScr" hidden>
  <div class="panel">
    <h2>PAUSA</h2>
    <div class="group">
      <button class="row primary" id="resume">CONTINUAR</button>
      <button class="row plain" id="restart">REINICIAR</button>
      <button class="row plain" id="pauseMenu">MENU</button>
    </div>
  </div>
</div>

<div class="ui screen" id="result" hidden>
  <div class="panel">
    <div class="result-text">
      <h2 id="resTitle"></h2>
      <div class="big" id="resMain"></div>
      <div class="sub hl" id="resSub"></div>
      <div class="sub" id="resStats"></div>
    </div>
    <div class="group">
      <button class="row primary" id="again">JOGAR DE NOVO</button>
      <button class="row plain" id="resMenu">MENU</button>
    </div>
  </div>
</div>

<script type="module" src="main.js"></script>
<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
